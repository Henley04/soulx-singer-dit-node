name: Build Prebuilt Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        type: string

# Cancel superseded runs on the same ref.
concurrency:
  group: build-prebuilt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.backend }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF'
            artifact_name: cpu.node
          - backend: vulkan
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=ON -DGGML_CUDA=OFF'
            artifact_name: vulkan.node
          - backend: cuda
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=ON'
            artifact_name: cuda.node

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          refreshenv 2>$null
          ninja --version

      - name: Install node-addon-api
        run: npm install node-addon-api

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp

      # Download Node.js development headers AND node.lib (import library)
      # directly from nodejs.org.  On Windows the linker needs node.lib to
      # resolve napi_* symbols — they are NOT resolved from the host process
      # at link time like on Linux/macOS.
      - name: Download Node.js headers & node.lib
        shell: pwsh
        run: |
          $nodeVersion = (node -v).TrimStart('v')
          $baseDir = "$env:RUNNER_TEMP\node-deps"
          New-Item -ItemType Directory -Force -Path $baseDir | Out-Null
          # --- Headers ---
          $headersUrl = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-headers.tar.gz"
          Write-Host "Downloading headers: $headersUrl"
          Invoke-WebRequest -Uri $headersUrl -OutFile "$env:RUNNER_TEMP\headers.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\headers.tar.gz" -C $baseDir
          # Find node_api.h recursively (tar extracts to a versioned subdir)
          $nodeApiFile = Get-ChildItem -Recurse $baseDir -Filter "node_api.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nodeApiFile) {
            Write-Error "node_api.h not found after extraction"
            Get-ChildItem -Recurse $baseDir | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          $incDir = $nodeApiFile.DirectoryName
          Write-Host "NODE_INCLUDE_DIR=$incDir"
          # --- node.lib (Windows import library) ---
          $libDir = "$baseDir\lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $libUrl = "https://nodejs.org/dist/v$nodeVersion/win-x64/node.lib"
          Write-Host "Downloading node.lib: $libUrl"
          Invoke-WebRequest -Uri $libUrl -OutFile "$libDir\node.lib"
          if (-not (Test-Path "$libDir\node.lib")) {
            Write-Error "Failed to download node.lib"
            exit 1
          }
          Write-Host "NODE_LIB_DIR=$libDir"
          # Export for subsequent steps
          "NODE_INCLUDE_DIR=$incDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "NODE_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Vulkan backend: install the Vulkan SDK and export VULKAN_SDK so CMake
      # can find it in subsequent steps.
      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Export VULKAN_SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          # humbletim/install-vulkan-sdk installs to the workspace dir, not
          # C:\VulkanSDK.  Search multiple locations and persist VULKAN_SDK.
          $candidates = @()
          if ($env:VULKAN_SDK) { $candidates += $env:VULKAN_SDK }
          $candidates += "$env:GITHUB_WORKSPACE\VULKAN_SDK"
          $candidates += "C:\VulkanSDK"
          $sdkPath = $null
          foreach ($c in $candidates) {
            Write-Host "Checking: $c"
            if ((Test-Path $c) -and (Test-Path "$c\Include\vulkan\vulkan.h")) {
              $sdkPath = $c
              break
            }
            # Also check subdirectories (versioned)
            if (Test-Path $c) {
              $sub = Get-ChildItem $c -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
              if ($sub -and (Test-Path "$($sub.FullName)\Include\vulkan\vulkan.h")) {
                $sdkPath = $sub.FullName
                break
              }
            }
          }
          if (-not $sdkPath) {
            Write-Error "Vulkan SDK not found in any expected location"
            exit 1
          }
          Write-Host "VULKAN_SDK=$sdkPath"
          "VULKAN_SDK=$sdkPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$sdkPath\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # CUDA backend: 12.4.0.  The runner has VS 2026 / MSVC 14.51 which is
      # newer than CUDA 12.4 supports.  NVCC_PREPEND_FLAGS injects
      # -allow-unsupported-compiler into every nvcc invocation, bypassing
      # host_config.h version checks BEFORE CMake's compiler detection.
      - name: Setup CUDA
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "curand"]'

      - name: Set CUDA compiler flags
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          "NVCC_PREPEND_FLAGS=-allow-unsupported-compiler" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "NVCC_PREPEND_FLAGS set to -allow-unsupported-compiler"

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            ${{ matrix.cmake_opts }} `
            -DNODE_INCLUDE_DIR="$env:NODE_INCLUDE_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Rename .node file
        shell: pwsh
        run: |
          $src = "build/soulx_singer_dit.node"
          if (-not (Test-Path $src)) { $src = "build/Release/soulx_singer_dit.node" }
          if (-not (Test-Path $src)) {
            Write-Error "Build output not found"
            Get-ChildItem -Recurse build -Filter "*.node" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $dest = "packages/win32-x64-${{ matrix.backend }}/${{ matrix.backend }}.node"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Copy-Item $src $dest -Force
          Write-Host "Produced: $dest"

      - name: Verify .node loads
        shell: pwsh
        run: |
          node -e "try { require('./packages/win32-x64-${{ matrix.backend }}/${{ matrix.backend }}.node'); console.log('LOAD OK'); } catch(e) { console.error('LOAD FAIL:', e.message); exit(1); }"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.backend }}-node
          path: packages/win32-x64-${{ matrix.backend }}/${{ matrix.backend }}.node
          retention-days: 30
          if-no-files-found: error

  collect:
    name: Collect and Prepare Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place .node files in subpackages
        run: |
          mkdir -p packages/win32-x64-cpu packages/win32-x64-vulkan packages/win32-x64-cuda
          cp artifacts/cpu-node/cpu.node packages/win32-x64-cpu/
          cp artifacts/vulkan-node/vulkan.node packages/win32-x64-vulkan/
          cp artifacts/cuda-node/cuda.node packages/win32-x64-cuda/
          ls -la packages/win32-x64-*/

      - name: Upload complete packages
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-packages
          path: packages/
          retention-days: 30
          if-no-files-found: error
