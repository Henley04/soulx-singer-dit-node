name: Build Prebuilt Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        type: string

# Cancel superseded runs on the same ref.
concurrency:
  group: build-prebuilt-${{ github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# Build matrix.
#
# Distribution goal: a SINGLE .node per (OS, arch) carries the CPU backend
# (always) plus whichever GPU backends are enabled, and the C++ runtime picks
# the fastest path at load time via ggml_backend_dev_count() (see
# pick_backend() in infer.cpp). GGML_NATIVE is forced OFF in CMakeLists.txt so
# no -march=native leaks into the binary; AMX/AVX512/AVX2 (x86) and
# NEON/i8mm/SVE (ARM) kernels are compiled in as separate objects and selected
# at runtime via ggml_cpu_has_*(). The same .node therefore runs on any CPU of
# that arch family without SIGILL.
#
# GPU backends are still split into separate .node files (cpu/vulkan/cuda) on
# Windows for now, because the Windows toolchain (CUDA toolkit, Vulkan SDK)
# makes a single all-backend binary large and fragile. Linux/macOS ship a
# CPU-only runtime-dispatched .node.
# ---------------------------------------------------------------------------
jobs:
  build:
    name: Build ${{ matrix.platform_key }}-${{ matrix.backend }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows x64 ----
          - os: windows
            backend: cpu
            runs_on: windows-latest
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF'
            artifact_name: cpu.node
            platform_key: win32-x64
          - os: windows
            backend: vulkan
            runs_on: windows-latest
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=ON -DGGML_CUDA=OFF'
            artifact_name: vulkan.node
            platform_key: win32-x64
          # CUDA needs VS 2022 (MSVC 14.4x); the default windows-latest
          # runner is now windows-2025-vs2026 (MSVC 14.51) whose cudafe++
          # crashes with every available CUDA version.
          - os: windows
            backend: cuda
            runs_on: windows-2022
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=ON'
            artifact_name: cuda.node
            platform_key: win32-x64
          # ---- Linux x64 CPU (runtime AMX/AVX512/AVX2 dispatch) ----
          - os: linux
            backend: cpu
            runs_on: ubuntu-latest
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF'
            artifact_name: cpu.node
            platform_key: linux-x64
          # ---- Linux arm64 CPU (runtime NEON/i8mm/SVE dispatch) ----
          # Uses GitHub's free native ARM64 runner for public repos.
          - os: linux
            backend: cpu
            runs_on: ubuntu-24.04-arm
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF'
            artifact_name: cpu.node
            platform_key: linux-arm64
          # ---- macOS arm64 (Apple Silicon, Accelerate) ----
          - os: macos
            backend: cpu
            runs_on: macos-14
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF -DGGML_ACCELERATE=ON'
            artifact_name: cpu.node
            platform_key: darwin-arm64
          # ---- macOS x64 (Intel, Accelerate) ----
          - os: macos
            backend: cpu
            runs_on: macos-13
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF -DGGML_ACCELERATE=ON'
            artifact_name: cpu.node
            platform_key: darwin-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build ccache

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          refreshenv 2>$null
          ninja --version

      - name: Install node-addon-api
        run: npm install node-addon-api

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp

      # Download Node.js development headers AND node.lib (import library)
      # directly from nodejs.org.  On Windows the linker needs node.lib to
      # resolve napi_* symbols — they are NOT resolved from the host process
      # at link time like on Linux/macOS.  Linux/macOS rely on the CMake
      # auto-detection of headers from the setup-node distribution.
      - name: Download Node.js headers & node.lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nodeVersion = (node -v).TrimStart('v')
          $baseDir = "$env:RUNNER_TEMP\node-deps"
          New-Item -ItemType Directory -Force -Path $baseDir | Out-Null
          # --- Headers ---
          $headersUrl = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-headers.tar.gz"
          Write-Host "Downloading headers: $headersUrl"
          Invoke-WebRequest -Uri $headersUrl -OutFile "$env:RUNNER_TEMP\headers.tar.gz"
          tar -xzf "$env:RUNNER_TEMP\headers.tar.gz" -C $baseDir
          # Find node_api.h recursively (tar extracts to a versioned subdir)
          $nodeApiFile = Get-ChildItem -Recurse $baseDir -Filter "node_api.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nodeApiFile) {
            Write-Error "node_api.h not found after extraction"
            Get-ChildItem -Recurse $baseDir | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          $incDir = $nodeApiFile.DirectoryName
          Write-Host "NODE_INCLUDE_DIR=$incDir"
          # --- node.lib (Windows import library) ---
          $libDir = "$baseDir\lib"
          New-Item -ItemType Directory -Force -Path $libDir | Out-Null
          $libUrl = "https://nodejs.org/dist/v$nodeVersion/win-x64/node.lib"
          Write-Host "Downloading node.lib: $libUrl"
          Invoke-WebRequest -Uri $libUrl -OutFile "$libDir\node.lib"
          if (-not (Test-Path "$libDir\node.lib")) {
            Write-Error "Failed to download node.lib"
            exit 1
          }
          Write-Host "NODE_LIB_DIR=$libDir"
          # Export for subsequent steps
          "NODE_INCLUDE_DIR=$incDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "NODE_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Vulkan backend: download the full Vulkan SDK installer (~175 MB)
      # and extract it with 7zip.  This is faster and more reliable than
      # running the Inno Setup installer (whose /S flag doesn't work — it
      # needs /VERYSILENT, but 7zip extraction avoids the installer entirely
      # and also works if the installer GUI would hang on the runner).
      # The full SDK is required because llama.cpp's CMake needs glslc
      # (the GLSL→SPIR-V compiler) in addition to headers + import lib.
      - name: Install Vulkan SDK (7zip extract)
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          # 1. Check for a pre-installed full SDK (includes glslc).
          if (Test-Path "C:\VulkanSDK") {
            $pre = Get-ChildItem "C:\VulkanSDK" -Directory -ErrorAction SilentlyContinue |
                   Sort-Object Name -Descending | Select-Object -First 1
            if ($pre -and (Test-Path "$($pre.FullName)\Include\vulkan\vulkan.h") -and
                          (Test-Path "$($pre.FullName)\Bin\glslc.exe")) {
              $sdkRoot = $pre.FullName
              Write-Host "Using pre-installed Vulkan SDK: $sdkRoot"
              "VULKAN_SDK=$sdkRoot" | Out-File $env:GITHUB_ENV -Append
              "$sdkRoot\Bin" | Out-File $env:GITHUB_PATH -Append
              return
            }
          }

          # 2. Download the installer with curl (faster than Invoke-WebRequest).
          $version = "1.3.296.0"
          $installer = "$env:RUNNER_TEMP\vulkan-installer.exe"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Write-Host "Downloading Vulkan SDK $version ..."
          & curl.exe -L --progress-bar --retry 3 -o $installer $url
          $sizeMB = [math]::Round((Get-Item $installer).Length / 1MB, 1)
          Write-Host "Downloaded: $sizeMB MB"

          # 3. Extract with 7zip (the installer is Inno Setup based).
          $extractDir = "$env:RUNNER_TEMP\vulkan-sdk"
          Write-Host "Extracting with 7zip ..."
          & 7z x $installer "-o$extractDir" -y | Select-String "Extracting|Everything"

          # 4. Locate the SDK root by finding glslc.exe and working upward.
          $sdkRoot = $null
          $glslcFiles = Get-ChildItem $extractDir -Recurse -Filter "glslc.exe" -ErrorAction SilentlyContinue
          foreach ($g in $glslcFiles) {
            $root = Split-Path $g.DirectoryName      # .../Bin -> ...
            if (Test-Path "$root\Include\vulkan\vulkan.h") {
              $sdkRoot = $root
              break
            }
          }
          if (-not $sdkRoot) {
            # Fallback: search for vulkan.h directly
            $vh = Get-ChildItem $extractDir -Recurse -Filter "vulkan.h" -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -match "Include" } | Select-Object -First 1
            if ($vh) { $sdkRoot = $vh.Directory.Parent.Parent.FullName }
          }
          if (-not $sdkRoot) {
            Write-Error "Could not locate Vulkan SDK root in extracted files"
            Get-ChildItem $extractDir -Depth 2 | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }
          Write-Host "VULKAN_SDK=$sdkRoot"
          "VULKAN_SDK=$sdkRoot" | Out-File $env:GITHUB_ENV -Append
          "$sdkRoot\Bin" | Out-File $env:GITHUB_PATH -Append

      # CUDA backend: 12.8.0 supports MSVC 14.4x+ (VS 2022 17.10+).  The
      # older action v0.2.15 only knew about CUDA ≤ 12.4.1; v0.2.35 fetches
      # the version list dynamically from NVIDIA's CDN, so 12.8.0 resolves.
      # No sub-packages filter — the full toolkit ensures cublas.lib and
      # headers are present so CMake can create the CUDA::cublas target.
      - name: Setup CUDA
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.8.0'
          method: 'network'

      - name: Set CUDA compiler flags
        if: matrix.backend == 'cuda'
        shell: pwsh
        run: |
          "NVCC_PREPEND_FLAGS=-allow-unsupported-compiler" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "NVCC_PREPEND_FLAGS set to -allow-unsupported-compiler"

      # SPIRV-Headers: llama.cpp's ggml-vulkan CMakeLists does
      # find_package(SPIRV-Headers REQUIRED), which needs a
      # SPIRV-HeadersConfig.cmake file.  The Vulkan SDK extraction
      # doesn't always include this CMake config, so clone the
      # KhronosGroup/SPIRV-Headers repo and install it to a prefix
      # that we pass to CMake via CMAKE_PREFIX_PATH.
      - name: Install SPIRV-Headers
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          $prefix = "$env:RUNNER_TEMP\spirv-headers-install"
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$env:RUNNER_TEMP\spirv-headers"
          cmake -S "$env:RUNNER_TEMP\spirv-headers" -B "$env:RUNNER_TEMP\spirv-headers\build" -DCMAKE_INSTALL_PREFIX="$prefix"
          cmake --install "$env:RUNNER_TEMP\spirv-headers\build"
          Write-Host "SPIRV-Headers installed to: $prefix"
          Get-ChildItem -Recurse "$prefix" -Filter "*SPIRV*Config*" | ForEach-Object { Write-Host "  Found: $($_.FullName)" }
          # Set the exact directory for find_package(SPIRV-Headers)
          $cmakeDir = "$prefix/share/cmake/SPIRV-Headers"
          "SPIRV_HEADERS_DIR=$cmakeDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "SPIRV_HEADERS_DIR=$cmakeDir"

      - name: Configure CMake
        shell: bash
        run: |
          set -e
          extra_args=""
          if [ "${{ matrix.backend }}" = "vulkan" ] && [ -n "$SPIRV_HEADERS_DIR" ]; then
            extra_args="-DSPIRV-Headers_DIR=$SPIRV_HEADERS_DIR"
          fi
          # On Windows, NODE_INCLUDE_DIR/NODE_LIB_DIR are exported to the env
          # by the "Download Node.js headers" step and picked up automatically
          # by CMakeLists.txt. On Linux/macOS the headers are auto-detected
          # from the setup-node distribution.
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_opts }} \
            $extra_args

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Rename .node file
        shell: bash
        run: |
          set -e
          src="build/soulx_singer_dit.node"
          if [ ! -f "$src" ]; then src="build/Release/soulx_singer_dit.node"; fi
          if [ ! -f "$src" ]; then
            echo "Build output not found"
            find build -name '*.node' 2>/dev/null || true
            exit 1
          fi
          dest="packages/${{ matrix.platform_key }}-${{ matrix.backend }}/${{ matrix.artifact_name }}"
          mkdir -p "$(dirname "$dest")"
          cp "$src" "$dest"
          echo "Produced: $dest"

      - name: Verify .node loads
        shell: bash
        run: |
          node -e "try { require('./packages/${{ matrix.platform_key }}-${{ matrix.backend }}/${{ matrix.artifact_name }}'); console.log('LOAD OK'); } catch(e) { console.error('LOAD FAIL:', e.message); exit(1); }"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform_key }}-${{ matrix.backend }}-node
          path: packages/${{ matrix.platform_key }}-${{ matrix.backend }}/${{ matrix.artifact_name }}
          retention-days: 30
          if-no-files-found: error

  collect:
    name: Collect and Prepare Packages
    needs: build
    runs-on: ubuntu-latest
    # Run even if some matrix legs failed — we publish whatever built.
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place .node files in subpackages
        run: |
          set -e
          # Every (platform_key, backend) combo the build matrix can produce.
          combos="
            win32-x64-cpu win32-x64-vulkan win32-x64-cuda
            linux-x64-cpu linux-arm64-cpu
            darwin-arm64-cpu darwin-x64-cpu
          "
          # Remove stale .node files from the repo checkout so we never
          # accidentally publish old/placeholder binaries.
          rm -f packages/*/*.node 2>/dev/null || true
          for combo in $combos; do
            # combo is e.g. "win32-x64-cpu"; split into platform_key and backend.
            backend="${combo##*-}"
            platform_key="${combo%-$backend}"
            node_file="cpu.node"
            [ "$backend" = "vulkan" ] && node_file="vulkan.node"
            [ "$backend" = "cuda" ]   && node_file="cuda.node"
            src="artifacts/${combo}-node/${node_file}"
            dst_dir="packages/${combo}"
            mkdir -p "$dst_dir"
            if [ -f "$src" ]; then
              cp "$src" "$dst_dir/"
              echo "Collected: ${combo}"
            else
              echo "MISSING: ${combo} (will skip publish for this combo)"
            fi
          done
          echo "--- packages tree ---"
          ls -la packages/*/

      - name: Upload complete packages
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-packages
          path: packages/
          retention-days: 30
          if-no-files-found: error
