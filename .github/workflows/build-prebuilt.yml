name: Build Prebuilt Binaries

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: false
        type: string

# Cancel superseded runs on the same ref.
concurrency:
  group: build-prebuilt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.backend }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF'
            artifact_name: cpu.node
          - backend: vulkan
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=ON -DGGML_CUDA=OFF'
            artifact_name: vulkan.node
          - backend: cuda
            cmake_opts: '-DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=ON'
            artifact_name: cuda.node

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y --no-progress
          refreshenv 2>$null
          ninja --version

      - name: Install node-addon-api
        run: npm install node-addon-api

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp

      # Download Node.js development headers directly from nodejs.org. This is
      # more reliable than node-gyp install, whose cache path varies across
      # runner images and node-gyp versions.
      - name: Download Node.js headers
        shell: pwsh
        run: |
          $nodeVersion = (node -v).TrimStart('v')
          $incDir = "$env:RUNNER_TEMP\node-headers\include\node"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-headers.tar.gz"
          Write-Host "Downloading headers from: $url"
          $tgz = "$env:RUNNER_TEMP\headers.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $tgz
          $extractDir = "$env:RUNNER_TEMP\node-headers"
          New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
          tar -xzf $tgz -C $extractDir --strip-components=1
          if (-not (Test-Path "$incDir\node_api.h")) {
            Write-Error "node_api.h not found at $incDir after extraction"
            Get-ChildItem -Recurse $extractDir -Filter "node_api.h" | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            exit 1
          }
          Write-Host "NODE_INCLUDE_DIR=$incDir"
          "NODE_INCLUDE_DIR=$incDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Use VS 2022 (17.x) instead of VS 2026 (18.x). The newer MSVC 14.51
      # toolset is too new for CUDA 12.x's host_config.h version checks.
      - name: Setup MSVC (VS 2022)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vs-version: '[17.0,18.0)'

      # Vulkan backend: install the Vulkan SDK so CMake can find glslang etc.
      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      # CUDA backend: pin a known-good version compatible with VS 2022's MSVC.
      - name: Setup CUDA
        if: matrix.backend == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: '12.4.0'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "curand"]'

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            ${{ matrix.cmake_opts }} `
            -DNODE_INCLUDE_DIR="$env:NODE_INCLUDE_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel

      # The CMake project always emits soulx_singer_dit.node; rename it to the
      # backend-specific name and drop it into the matching subpackage dir so
      # the collect job (and the publish workflow) can pick it up verbatim.
      - name: Rename .node file
        shell: pwsh
        run: |
          $src = "build/soulx_singer_dit.node"
          if (-not (Test-Path $src)) { $src = "build/Release/soulx_singer_dit.node" }
          if (-not (Test-Path $src)) {
            Write-Error "Build output not found at build/soulx_singer_dit.node or build/Release/soulx_singer_dit.node"
            Get-ChildItem -Recurse build -Filter "*.node" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          $dest = "packages/win32-x64-${{ matrix.backend }}/${{ matrix.backend }}.node"
          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          Copy-Item $src $dest -Force
          Write-Host "Produced: $dest"

      # Make sure the freshly built .node actually dlopens under Node before we
      # upload it — a failed link (e.g. missing DLL) is caught here rather than
      # after publish.
      - name: Verify .node loads
        shell: pwsh
        run: |
          node -e "try { require('./packages/win32-x64-${{ matrix.backend }}/${{ matrix.backend }}.node'); console.log('LOAD OK'); } catch(e) { console.error('LOAD FAIL:', e.message); exit(1); }"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.backend }}-node
          path: packages/win32-x64-${{ matrix.backend }}/${{ matrix.backend }}.node
          retention-days: 30
          if-no-files-found: error

  collect:
    name: Collect and Prepare Packages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Place .node files in subpackages
        run: |
          mkdir -p packages/win32-x64-cpu packages/win32-x64-vulkan packages/win32-x64-cuda
          cp artifacts/cpu-node/cpu.node packages/win32-x64-cpu/
          cp artifacts/vulkan-node/vulkan.node packages/win32-x64-vulkan/
          cp artifacts/cuda-node/cuda.node packages/win32-x64-cuda/
          ls -la packages/win32-x64-*/

      - name: Upload complete packages
        uses: actions/upload-artifact@v7
        with:
          name: prebuilt-packages
          path: packages/
          retention-days: 30
          if-no-files-found: error
