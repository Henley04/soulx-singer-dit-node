name: Publish to npm

on:
  workflow_run:
    workflows: ["Build Prebuilt Binaries"]
    types:
      - completed
  workflow_dispatch:

jobs:
  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    # Run on any completed build (success OR failure, since collect runs
    # `if: always()` and uploads whatever backends built), or on manual dispatch.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      id-token: write  # REQUIRED for npm OIDC trusted publisher / provenance
      contents: write  # Needed to create GitHub Release
      actions: read    # Needed to download artifacts from the triggering workflow_run

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # registry-url configures ~/.npmrc with the registry; no token is
          # written because authentication is handled via OIDC below.
          registry-url: 'https://registry.npmjs.org'

      # ---------------------------------------------------------------------
      # Authentication: npm token (NPM_TOKEN secret) with provenance.
      #
      # TODO: Once OIDC trusted publisher is configured on npm for all four
      # packages, remove the NODE_AUTH_TOKEN env vars below and rely on
      # `npm publish --provenance` OIDC exchange exclusively.  Until then,
      # the NPM_TOKEN secret provides authentication and --provenance still
      # generates a signed provenance attestation.
      # ---------------------------------------------------------------------

      - name: Download prebuilt artifacts
        uses: actions/github-script@v9
        with:
          script: |
            // Download the 'prebuilt-packages' artifact from the triggering
            // workflow run (or, for a manual dispatch, the most recent one).
            const fs = require('fs');
            const path = require('path');

            let artifacts;
            if (context.eventName === 'workflow_dispatch') {
              // For manual dispatch, list recent artifacts of this name.
              artifacts = await github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'prebuilt-packages',
                per_page: 5
              });
            } else {
              // For workflow_run trigger, get artifacts from the triggering run.
              artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
              });
            }

            const matchArtifact = artifacts.data.artifacts.find(a => a.name === 'prebuilt-packages');
            if (!matchArtifact) {
              core.setFailed('prebuilt-packages artifact not found');
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('prebuilt.zip', Buffer.from(download.data));

      - name: Extract artifacts
        run: |
          mkdir -p packages-tmp
          unzip prebuilt.zip -d packages-tmp
          # Remove any stale .node files from the repo checkout first.
          rm -f packages/win32-x64-*/*.node
          # Copy whichever .node files exist into the subpackage dirs.
          for backend in cpu vulkan cuda; do
            src="packages-tmp/win32-x64-${backend}/${backend}.node"
            if [ -f "$src" ]; then
              cp "$src" "packages/win32-x64-${backend}/"
              echo "Present: ${backend}"
            else
              echo "Absent:  ${backend} (will skip its publish step)"
            fi
          done
          ls -la packages/win32-x64-*/

      - name: Read version from package.json
        id: version
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Publish CPU subpackage
        if: hashFiles('packages/win32-x64-cpu/cpu.node') != ''
        run: |
          cd packages/win32-x64-cpu
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Vulkan subpackage
        if: hashFiles('packages/win32-x64-vulkan/vulkan.node') != ''
        run: |
          cd packages/win32-x64-vulkan
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish CUDA subpackage
        if: hashFiles('packages/win32-x64-cuda/cuda.node') != ''
        run: |
          cd packages/win32-x64-cuda
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish main package
        # Only publish the umbrella package if at least one backend built.
        if: hashFiles('packages/win32-x64-cpu/cpu.node') != '' || hashFiles('packages/win32-x64-vulkan/vulkan.node') != '' || hashFiles('packages/win32-x64-cuda/cuda.node') != ''
        run: |
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
