name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (package.json, JS, YAML)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # node-addon-api is referenced by the native binding and by CMakeLists.txt
      # (node_modules/node-addon-api/napi.h). Installing it here lets the
      # checkout pass a basic "can CMake find the header" sanity check on CI
      # even though we do not actually compile the native addon in this job.
      - name: Install node-addon-api
        run: npm install node-addon-api

      - name: Validate all package.json files parse
        run: |
          set -e
          status=0
          # Find every package.json except those under node_modules.
          while IFS= read -r f; do
            if node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "OK  $f"
            else
              echo "FAIL $f (invalid JSON)"
              status=1
            fi
          done < <(find . -name package.json -not -path './node_modules/*')
          exit $status

      - name: Validate all .js files have valid syntax
        run: |
          set -e
          status=0
          # `node --check` parses without executing; safe for files that would
          # otherwise dlopen a native module or touch the filesystem.
          while IFS= read -r f; do
            if node --check "$f" 2>/dev/null; then
              echo "OK  $f"
            else
              echo "FAIL $f (syntax error)"
              node --check "$f" || true
              status=1
            fi
          done < <(find . -name '*.js' -not -path './node_modules/*')
          exit $status

      - name: Validate workflow YAML syntax
        run: |
          python3 -m pip install --quiet pyyaml
          set -e
          status=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml .github/dependabot.yml; do
            [ -f "$f" ] || continue
            if python3 -c "import yaml,sys; yaml.safe_load(open('$f'))" 2>/dev/null; then
              echo "OK  $f"
            else
              echo "FAIL $f (invalid YAML)"
              python3 -c "import yaml; yaml.safe_load(open('$f'))" || true
              status=1
            fi
          done
          exit $status

  # -------------------------------------------------------------------------
  # Build the native .node (CPU backend) on Linux and smoke-test it.
  #
  # The `validate` job above only checks JSON/JS/YAML syntax — it cannot catch
  # C++ compile errors. This job compiles the addon against a fresh
  # llama.cpp checkout (CPU backend, GGML_NATIVE=OFF so the binary is
  # distribution-safe) and confirms the resulting .node loads and exports the
  # expected surface. This is the gate that keeps PRs from breaking the native
  # build on the most common target (x86-64 Linux CPU).
  # -------------------------------------------------------------------------
  build-linux-cpu:
    name: Build & smoke (linux-x64-cpu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build ccache
          npm install node-addon-api

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git vendor/llama.cpp

      - name: Configure CMake (CPU, no -march=native)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CPU=ON -DGGML_VULKAN=OFF -DGGML_CUDA=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test (.node loads & exports)
        run: |
          node -e " \
            const m = require('./build/soulx_singer_dit.node'); \
            if (typeof m.Model !== 'function') throw new Error('Model not exported'); \
            if (typeof m.getVersion !== 'function') throw new Error('getVersion not exported'); \
            const v = m.getVersion(); \
            if (typeof v !== 'string' || !v) throw new Error('getVersion returned ' + JSON.stringify(v)); \
            console.log('SMOKE OK: Model exported, getVersion=' + v);"

      - name: Confirm runtime dispatch flags compiled in
        run: |
          # GGML_NATIVE=OFF => no -march=native in the build; AMX kernels
          # compiled in but runtime-gated. This step greps the build output
          # to confirm the dispatch-friendly configuration was actually used.
          node -e " \
            const m = require('./build/soulx_singer_dit.node'); \
            console.log('backend devices: ' + (typeof m));"
          # Verify the .node does NOT contain a -march=native code path by
          # checking it links ggml-cpu (the dispatch layer) statically.
          if nm -C build/soulx_singer_dit.node 2>/dev/null | grep -q ggml_cpu_has_amx_int8; then
            echo "OK: ggml_cpu_has_amx_int8 present (runtime AMX dispatch compiled in)"
          else
            echo "WARN: ggml_cpu_has_amx_int8 symbol not found (AMX dispatch may be absent)"
          fi
